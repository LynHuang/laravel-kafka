name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            laravel: '8.*'
            testbench: '6.*'
            composer: '2.8'
          - php: '8.1'
            laravel: '9.*'
            testbench: '7.*'
            composer: '2.8'
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            composer: '2.8'
          - php: '8.3'
            laravel: '10.*'
            testbench: '8.*'
            composer: '2.8'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            composer: '2.8'
    services:
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: 'broker,controller'
          KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
          KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
          CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      # v0.4.8: 加 Redis service (7.2-alpine 轻量, 默认无密码, 端口 6379)
      # 用于: HorizonMetricsRecorder / RedisFailedJobProvider / queue:failed 等
      # Redis 集成测试 (CI runner 之前没 Redis, Horizon 集成测不了)
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install librdkafka
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: rdkafka
          tools: composer:${{ matrix.composer }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/queue:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-update --no-interaction
          composer update --prefer-dist --no-interaction

      - name: Wait for Kafka
        run: |
          for i in {1..60}; do
            if (echo > /dev/tcp/localhost/9092) 2>/dev/null; then
              echo "Kafka is up"
              exit 0
            fi
            echo "Waiting for Kafka... ($i/60)"
            sleep 2
          done
          echo "Kafka failed to start"
          exit 1

      - name: Run tests
        # v0.4.7 修复: KafkaQueueFakeTest::testPushRawInNormalModeGoesToRealProducer
        # 之前假设 "non-fake 模式下 pushRaw 必抛 Throwable", 但 CI 有真 Kafka
        # (services.kafka) + 业务方本机有 Kafka, pushRaw 真发成功, test 期望错.
        # 现在改核心断言: non-fake 模式不写 FakeMessageStorage (无论真发成功/抛异常).
        # 删 v0.4.3 hotfix 加的 continue-on-error: true.
        run: vendor/bin/phpunit --testsuite=Unit

  integration:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    # 集成测试依赖 Kafka 集群，v0.1 暂不强制在 CI 跑
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install librdkafka
        run: sudo apt-get install -y librdkafka-dev

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: rdkafka

      - name: Start Kafka via Testcontainers
        run: vendor/bin/testcontainers start kafka:3.6.1

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite=Integration
        env:
          KAFKA_BROKERS: localhost:9092
