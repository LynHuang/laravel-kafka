name: linter

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install librdkafka
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: rdkafka
          tools: composer
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/queue:^8.0 || ^9.0 || ^10.0 || ^11.0" \
            "illuminate/support:^8.0 || ^9.0 || ^10.0 || ^11.0" \
            "illuminate/console:^8.0 || ^9.0 || ^10.0 || ^11.0" \
            "illuminate/contracts:^8.0 || ^9.0 || ^10.0 || ^11.0" \
            "orchestra/testbench:^6.0 || ^7.0 || ^8.0 || ^9.0" \
            --no-update --no-interaction
          composer update --prefer-dist --no-interaction

      - name: Check style
        # v0.4.8: PHP-CS-Fixer 3.75 自动 fix 40 文件后, 现在 0 diff. 删 v0.4.1 hotfix
        # 加的 continue-on-error, 让 cs-fixer 真 fail 时 CI 卡住.
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install librdkafka
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: rdkafka
          tools: composer
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/queue:^8.0 || ^9.0 || ^10.0 || ^11.0" \
            "illuminate/support:^8.0 || ^9.0 || ^10.0 || ^11.0" \
            "illuminate/console:^8.0 || ^9.0 || ^10.0 || ^11.0" \
            "illuminate/contracts:^8.0 || ^9.0 || ^10.0 || ^11.0" \
            "orchestra/testbench:^6.0 || ^7.0 || ^8.0 || ^9.0" \
            --no-update --no-interaction
          composer update --prefer-dist --no-interaction

      - name: Run phpstan
        # v0.4.8: PHPStan 0 errors (之前 120 errors v0.4.1 已知全清, RedisFailedJobProvider
        # magic method 走 phpstan.neon ignoreErrors). 删 v0.4.1 hotfix 加的 continue-on-error.
        run: vendor/bin/phpstan analyse src --no-progress
